<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:100px;
}

.profile-card{
background:#1C2550;
border-radius:28px;
padding:28px;
text-align:center;
margin-bottom:20px;
}

.avatar{
font-size:72px;
margin-bottom:16px;
}

.name{
font-size:32px;
font-weight:700;
margin-bottom:10px;
}

.level{
color:#D4A63D;
font-weight:700;
margin-bottom:10px;
}

.identity{
opacity:0.9;
}

.section-title{
font-size:24px;
font-weight:700;
margin:20px 0 12px;
}

.stat-card{
background:#1C2550;
padding:20px;
border-radius:20px;
margin-bottom:12px;
}

.stat-value{
font-size:28px;
font-weight:700;
}

.stat-label{
opacity:0.8;
margin-top:6px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:430px;
margin:auto;
background:#141A33;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:1px solid #252D52;
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.active{
color:#D4A63D !important;
}

</style>

</head>

<body>

<div class="profile-card">

<div class="avatar">
🏃
</div>

<div id="user-name" class="name">
Loading...
</div>

<div id="user-level" class="level">
LEVEL 0
</div>

<div id="main-identity" class="identity">
Loading...
</div>

</div>

<div class="section-title">
Running Stats
</div>

<div class="stat-card">

<div id="total-runs" class="stat-value">
0
</div>

<div class="stat-label">
Total Runs
</div>

</div>

<div class="stat-card">

<div id="total-distance" class="stat-value">
0
</div>

<div class="stat-label">
Total Distance (km)
</div>

</div>

<div class="stat-card">

<div id="total-cards" class="stat-value">
0
</div>

<div class="stat-label">
Cards Collected
</div>

</div>

<div class="stat-card">

<div id="total-identities" class="stat-value">
0
</div>

<div class="stat-label">
Identities Unlocked
</div>

</div>

<div class="bottom-nav">

<a href="Home.html">
Home
</a>

<a href="Passport.html">
Passport
</a>

<a href="Identity.html">
Identity
</a>

<a class="active" href="Profile.html">
Profile
</a>

</div>

<script>

Promise.all([
fetch('./data/user.json').then(r=>r.json()),
fetch('./data/identities.json').then(r=>r.json())
])

.then(([user,identities])=>{

document.getElementById('user-name')
.innerText =
user.name;

document.getElementById('user-level')
.innerText =
'LEVEL ' + user.level;

document.getElementById('total-runs')
.innerText =
user.runs;

document.getElementById('total-distance')
.innerText =
user.distance;

document.getElementById('total-cards')
.innerText =
user.earnedCards.length;

document.getElementById('total-identities')
.innerText =
user.unlockedIdentities.length;

const identity =
identities.find(
i => i.id === user.mainIdentity
);

if(identity){

document.getElementById('main-identity')
.innerText =
identity.icon + ' ' + identity.name;

}

});

</script>

</body>
</html>
