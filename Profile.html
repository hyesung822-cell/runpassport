<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:100px;
}

.profile-card{
background:#1C2550;
border-radius:24px;
padding:24px;
margin-bottom:24px;
text-align:center;
}

.avatar{
font-size:64px;
margin-bottom:12px;
}

.name{
font-size:28px;
font-weight:700;
margin-bottom:8px;
}

.level{
opacity:.8;
}

.identity{
margin-top:16px;
padding:12px;
background:#2A3467;
border-radius:14px;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:14px;
margin-top:24px;
}

.stats-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.stat-card{
background:#1C2550;
border-radius:18px;
padding:18px;
}

.stat-value{
font-size:24px;
font-weight:700;
}

.stat-label{
opacity:.7;
margin-top:4px;
}

.menu-link{
display:block;
background:#1C2550;
padding:18px;
border-radius:18px;
text-decoration:none;
color:white;
margin-bottom:12px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:430px;
margin:auto;
background:#141A33;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:1px solid #252D52;
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.active{
color:#D4A63D !important;
}

</style>
</head>

<body>

<div class="profile-card">

<div class="avatar">
🏃
</div>

<div id="name" class="name">
Loading...
</div>

<div id="level" class="level">
LEVEL 0
</div>

<div class="identity">

<div style="font-size:12px;opacity:.7;">
MAIN IDENTITY
</div>

<div
id="main-identity"
style="margin-top:6px;font-weight:700;">
Loading...
</div>

</div>

</div>

<div class="section-title">
Statistics
</div>

<div class="stats-grid">

<div class="stat-card">
<div id="distance" class="stat-value">
0
</div>
<div class="stat-label">
KM
</div>
</div>

<div class="stat-card">
<div id="runs" class="stat-value">
0
</div>
<div class="stat-label">
Runs
</div>
</div>

<div class="stat-card">
<div id="cards" class="stat-value">
0
</div>
<div class="stat-label">
Cards
</div>
</div>

<div class="stat-card">
<div id="identities" class="stat-value">
0
</div>
<div class="stat-label">
Identities
</div>
</div>

</div>

<div class="section-title">
Collection
</div>

<a
class="menu-link"
href="Identity.html">
🌅 Identity Collection
</a>

<a
class="menu-link"
href="Passport.html">
🎴 Card Collection
</a>

<div class="bottom-nav">

<a href="Home.html">
Home
</a>

<a href="Run.html">
Run
</a>

<a href="Calendar.html">
Calendar
</a>

<a href="Passport.html">
Passport
</a>

<a class="active" href="Profile.html">
Profile
</a>

</div>

<script>

Promise.all([
fetch('./data/user.json')
.then(r=>r.json()),

fetch('./data/identities.json')
.then(r=>r.json())
])

.then(([user,identities])=>{

document.getElementById('name')
.innerText =
user.name || 'Runner';

document.getElementById('level')
.innerText =
'LEVEL ' + user.level;

document.getElementById('distance')
.innerText =
user.distance;

document.getElementById('runs')
.innerText =
user.runs;

document.getElementById('cards')
.innerText =
user.earnedCards.length;

document.getElementById('identities')
.innerText =
user.unlockedIdentities.length;

const identity =
identities.find(
i => i.id === user.mainIdentity
);

if(identity){

document.getElementById('main-identity')
.innerText =
identity.name;

}

});

</script>

</body>
</html>
