<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Passport</title>

<style>

body{
    background:#0B1023;
    color:white;
    font-family:sans-serif;
    max-width:430px;
    margin:auto;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

.card{
    background:#1c2550;
    border-radius:20px;
    padding:20px;
    margin-bottom:16px;
    text-align:center;
    transition:0.2s;
}

.card:hover{
    transform:translateY(-2px);
}

.card-icon{
    font-size:40px;
    margin-bottom:10px;
}

.card-name{
    font-size:18px;
    font-weight:bold;
}

.rarity{
    margin-top:10px;
    font-size:12px;
    font-weight:bold;
}

.common{
    color:#C9CDD4;
}

.rare{
    color:#4DA3FF;
}

.epic{
    color:#B06CFF;
}

.legendary{
    color:#F5C451;
}

a{
    color:#d4a63d;
}

.card-link{
    text-decoration:none;
    color:white;
}

</style>

</head>

<body>

<h1>Passport</h1>

<div id="card-list">
Loading...
</div>

<br>

<a href="Home.html">← Home</a>

<script>

function getIcon(category){

    if(category === "time") return "⏰";
    if(category === "habit") return "🔥";
    if(category === "distance") return "🏃";
    if(category === "passport") return "🌍";
    if(category === "growth") return "📈";

    return "🏅";

}

Promise.all([
    fetch('./data/cards.json').then(r => r.json()),
    fetch('./data/user.json').then(r => r.json())
])

.then(([cards, user]) => {

    const earnedCards = user.earnedCards;

    const unlockedCards =
        cards.filter(card =>
            earnedCards.includes(card.id)
        );

    const container =
        document.getElementById('card-list');

    container.innerHTML = '';

    unlockedCards.forEach(card => {

        container.innerHTML += `
        <a class="card-link" href="Card.html?id=${card.id}">

            <div class="card">

                <div class="card-icon">
                    ${getIcon(card.category)}
                </div>

                <div class="card-name">
                    ${card.name}
                </div>

                <div class="rarity ${card.rarity}">
                    ${card.rarity.toUpperCase()}
                </div>

            </div>

        </a>
        `;

    });

})

.catch(error => {

    console.error(error);

    document.getElementById('card-list').innerHTML =
        '데이터 로딩 실패';

});

</script>

</body>
</html>
