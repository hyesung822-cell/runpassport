<!DOCTYPE html>

<html>
<head>
<title>Passport</title>
</head>
<body>

<h1>Passport</h1>

<ul id="card-list"></ul>

<br>

<a href="index.html">Home</a>

<script>
fetch('./data/cards.json')
  .then(response => response.json())
  .then(cards => {

    const list = document.getElementById('card-list');

    cards.forEach(card => {

      const item = document.createElement('li');

      item.textContent =
        card.name +
        ' (' +
        card.rarity +
        ')';

      list.appendChild(item);

    });

  });
</script>

</body>
</html>
