<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Passport</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:100px;
}

h1{
font-size:36px;
margin-bottom:24px;
}

.collection{
background:#1C2550;
padding:18px;
border-radius:18px;
margin-bottom:24px;
}

.collection-number{
font-size:42px;
font-weight:700;
}

.collection-label{
opacity:.7;
margin-top:4px;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:14px;
margin-top:20px;
}

.card-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.card-link{
text-decoration:none;
color:white;
}

.card{
background:#1C2550;
border-radius:18px;
padding:16px;
min-height:120px;
}

.card-name{
font-size:18px;
font-weight:700;
margin-bottom:10px;
}

.category{
font-size:12px;
opacity:.7;
margin-bottom:10px;
}

.rarity{
font-size:12px;
font-weight:700;
}

.common{
color:#BFC5D2;
}

.rare{
color:#5DA9FF;
}

.epic{
color:#C07BFF;
}

.legendary{
color:#D4A63D;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:430px;
margin:auto;
background:#141A33;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:1px solid #252D52;
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.active{
color:#D4A63D !important;
}

</style>
</head>

<body>

<h1>Passport</h1>

<div class="collection">

<div
id="card-count"
class="collection-number">
0
</div>

<div class="collection-label">
Cards Collected
</div>

</div>

<div class="section-title">
Collection
</div>

<div
id="card-grid"
class="card-grid">
Loading...
</div>

<div class="bottom-nav">

<a href="Home.html">
Home
</a>

<a href="Run.html">
Run
</a>

<a href="Calendar.html">
Calendar
</a>

<a class="active" href="Passport.html">
Passport
</a>

<a href="Profile.html">
Profile
</a>

</div>

<script>

Promise.all([
fetch('./data/cards.json')
.then(r=>r.json()),

fetch('./data/user.json')
.then(r=>r.json())
])

.then(([cards,user])=>{

const earned =
user.earnedCards;

const unlockedCards =
cards.filter(card =>
earned.includes(card.id)
);

document.getElementById('card-count')
.innerText =
unlockedCards.length;

const container =
document.getElementById('card-grid');

container.innerHTML='';

unlockedCards.forEach(card=>{

container.innerHTML += `

<a
class="card-link"
href="Card.html?id=${card.id}"
>

<div class="card">

<div class="card-name">
${card.name}
</div>

<div class="category">
${card.category}
</div>

<div
class="rarity ${card.rarity}">
${card.rarity.toUpperCase()}
</div>

</div>

</a>

`;

});

});

</script>

</body>
</html>
