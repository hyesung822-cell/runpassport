<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Passport</title>

<style>
body{
    background:#0B1023;
    color:white;
    font-family:sans-serif;
    max-width:430px;
    margin:auto;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

.card{
    background:#1c2550;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
}

.rarity{
    font-size:12px;
    opacity:0.7;
    margin-top:6px;
}

a{
    color:#d4a63d;
}
</style>

</head>

<body>

<h1>Passport</h1>

<div id="card-list">
Loading...
</div>

<br>

<a href="Home.html">Home</a>

<script>

Promise.all([
fetch('./data/cards.json').then(r=>r.json()),
fetch('./data/user.json').then(r=>r.json())
])

.then(([cards,user])=>{

console.log(cards);
console.log(user);

document.getElementById('card-list').innerHTML =
'카드 데이터 로드 성공';

})

.catch(error=>{

console.error(error);

document.getElementById('card-list').innerHTML =
'에러 발생: ' + error;

});

</script>

</body>
</html>
