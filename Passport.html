<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Passport</title>

<style>

body{
    background:#0B1023;
    color:white;
    font-family:sans-serif;
    max-width:430px;
    margin:auto;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

.card{
    background:#1c2550;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
}

.card-name{
    font-size:18px;
    font-weight:bold;
}

.rarity{
    margin-top:8px;
    font-size:12px;
    opacity:0.7;
}

a{
    color:#d4a63d;
}

</style>

</head>

<body>

<h1>Passport</h1>

<div id="card-list">
Loading...
</div>

<br>

<a href="Home.html">Home</a>

<script>

Promise.all([
    fetch('./data/cards.json').then(r => r.json()),
    fetch('./data/user.json').then(r => r.json())
])

.then(([cards,user]) => {

    const earnedCards = user.earnedCards;

    const unlockedCards =
        cards.filter(card =>
            earnedCards.includes(card.id)
        );

    const container =
        document.getElementById('card-list');

    container.innerHTML = '';

    unlockedCards.forEach(card => {

        container.innerHTML += `
            <div class="card">
                <div class="card-name">
                    ${card.name}
                </div>

                <div class="rarity">
                    ${card.rarity}
                </div>
            </div>
        `;

    });

})

.catch(error => {

    console.error(error);

    document.getElementById('card-list').innerHTML =
        '데이터 로딩 실패';

});

</script>

</body>
</html>
