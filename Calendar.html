<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Calendar</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:100px;
}

h1{
font-size:36px;
margin-bottom:24px;
}

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:24px;
}

.summary-card{
background:#1C2550;
padding:18px;
border-radius:18px;
}

.summary-value{
font-size:28px;
font-weight:700;
}

.summary-label{
opacity:.7;
margin-top:4px;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:14px;
margin-top:24px;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
}

.day{
background:#1C2550;
border-radius:14px;
min-height:65px;
padding:10px;
text-align:center;
}

.day-number{
font-size:14px;
}

.run-icon{
margin-top:8px;
font-size:14px;
}

.run-link{
text-decoration:none;
color:white;
}

.run-card{
background:#1C2550;
border-radius:18px;
padding:18px;
margin-bottom:12px;
}

.date{
font-size:14px;
opacity:.7;
}

.distance{
font-size:24px;
font-weight:700;
margin-top:8px;
}

.duration{
margin-top:6px;
opacity:.8;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:430px;
margin:auto;
background:#141A33;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:1px solid #252D52;
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.active{
color:#D4A63D !important;
}

</style>
</head>

<body>

<h1>Calendar</h1>

<div class="summary">

<div class="summary-card">
<div id="monthDistance" class="summary-value">
0
</div>
<div class="summary-label">
KM THIS MONTH
</div>
</div>

<div class="summary-card">
<div id="monthRuns" class="summary-value">
0
</div>
<div class="summary-label">
RUNS
</div>
</div>

</div>

<div class="section-title">
June
</div>

<div id="calendar" class="calendar">
Loading...
</div>

<div class="section-title">
Recent Runs
</div>

<div id="run-list">
Loading...
</div>

<div class="bottom-nav">

<a href="Home.html">
Home
</a>

<a href="Run.html">
Run
</a>

<a class="active" href="Calendar.html">
Calendar
</a>

<a href="Passport.html">
Passport
</a>

<a href="Profile.html">
Profile
</a>

</div>

<script>

fetch('./data/runs.json')

.then(r=>r.json())

.then(runs=>{

let totalDistance = 0;

runs.forEach(run=>{

totalDistance += run.distance;

});

document.getElementById('monthDistance')
.innerText =
totalDistance.toFixed(1);

document.getElementById('monthRuns')
.innerText =
runs.length;

const calendar =
document.getElementById('calendar');

calendar.innerHTML = '';

for(let day=1; day<=30; day++){

const runExists =
runs.find(run=>{

const runDay =
Number(
run.date.split('-')[2]
);

return runDay === day;

});

calendar.innerHTML += `

<div class="day">

<div class="day-number">
${day}
</div>

<div class="run-icon">
${runExists ? '🏃' : ''}
</div>

</div>

`;

}

const runList =
document.getElementById('run-list');

runList.innerHTML = '';

runs
.slice()
.reverse()
.forEach(run=>{

runList.innerHTML += `

<a
class="run-link"
href="RunDetail.html?id=${run.id}"
>

<div class="run-card">

<div class="date">
${run.date}
</div>

<div class="distance">
${run.distance} km
</div>

<div class="duration">
${Math.floor(run.duration/60)}분
</div>

</div>

</a>

`;

});

});

</script>

</body>
</html>
