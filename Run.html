<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Run</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:100px;
text-align:center;
}

h1{
font-size:36px;
margin-bottom:30px;
}

.metric{
margin-bottom:28px;
}

.value{
font-size:56px;
font-weight:700;
}

.label{
margin-top:6px;
opacity:0.7;
}

.button-group{
display:flex;
gap:12px;
justify-content:center;
margin-top:24px;
}

button{
padding:16px 22px;
border:none;
border-radius:18px;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.start-btn{
background:#D4A63D;
color:#0B1023;
}

.finish-btn{
background:#1C2550;
color:white;
}

#status{
margin-top:20px;
opacity:0.8;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:430px;
margin:auto;
background:#141A33;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:1px solid #252D52;
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.active{
color:#D4A63D !important;
}

</style>
</head>

<body>

<h1>RUN</h1>

<div class="metric">
<div id="distance" class="value">0.00</div>
<div class="label">KM</div>
</div>

<div class="metric">
<div id="timer" class="value">00:00:00</div>
<div class="label">TIME</div>
</div>

<div class="metric">
<div id="pace" class="value">0:00</div>
<div class="label">PACE / KM</div>
</div>

<div id="status">
GPS 준비 완료
</div>

<div class="button-group">

<button
id="startBtn"
class="start-btn">
START
</button>

<button
id="finishBtn"
class="finish-btn">
FINISH
</button>

</div>

<div class="bottom-nav">

<a href="Home.html">Home</a>

<a class="active" href="Run.html">
Run
</a>

<a href="Calendar.html">
Calendar
</a>

<a href="Passport.html">
Passport
</a>

<a href="Profile.html">
Profile
</a>

</div>

<script>

let running = false;

let seconds = 0;

let timerInterval;

let watchId;

let totalDistance = 0;

let lastPosition = null;

function calculateDistance(
lat1,
lon1,
lat2,
lon2
){

const R = 6371;

const dLat =
(lat2-lat1) * Math.PI/180;

const dLon =
(lon2-lon1) * Math.PI/180;

const a =
Math.sin(dLat/2) *
Math.sin(dLat/2) +

Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *

Math.sin(dLon/2) *
Math.sin(dLon/2);

const c =
2 *
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

return R*c;

}

function updateTimer(){

seconds++;

const hrs =
String(Math.floor(seconds/3600))
.padStart(2,'0');

const mins =
String(Math.floor((seconds%3600)/60))
.padStart(2,'0');

const secs =
String(seconds%60)
.padStart(2,'0');

document.getElementById('timer')
.innerText =
`${hrs}:${mins}:${secs}`;

if(totalDistance > 0){

const paceSeconds =
seconds / totalDistance;

const paceMin =
Math.floor(
paceSeconds / 60
);

const paceSec =
Math.floor(
paceSeconds % 60
);

document.getElementById('pace')
.innerText =
`${paceMin}:${String(paceSec).padStart(2,'0')}`;

}

}

document
.getElementById('startBtn')
.addEventListener('click',()=>{

if(!running){

running = true;

document
.getElementById('startBtn')
.innerText = 'PAUSE';

document
.getElementById('status')
.innerText =
'GPS 추적 중';

timerInterval =
setInterval(
updateTimer,
1000
);

watchId =
navigator.geolocation.watchPosition(

(position)=>{

const lat =
position.coords.latitude;

const lon =
position.coords.longitude;

if(lastPosition){

const distance =
calculateDistance(
lastPosition.lat,
lastPosition.lon,
lat,
lon
);

totalDistance += distance;

document
.getElementById('distance')
.innerText =
totalDistance.toFixed(2);

}

lastPosition = {
lat,
lon
};

},

()=>{

document
.getElementById('status')
.innerText =
'GPS 권한 필요';

}

);

}else{

running = false;

clearInterval(
timerInterval
);

navigator.geolocation
.clearWatch(
watchId
);

document
.getElementById('startBtn')
.innerText = 'START';

document
.getElementById('status')
.innerText =
'일시정지';

}

});

document
.getElementById('finishBtn')
.addEventListener('click',()=>{

clearInterval(
timerInterval
);

if(watchId){

navigator.geolocation
.clearWatch(
watchId
);

}

alert(
`러닝 완료!\n\n거리: ${totalDistance.toFixed(2)}km`
);

});

</script>

</body>
</html>
