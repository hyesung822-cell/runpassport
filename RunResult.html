<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Result</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:40px;
text-align:center;
}

.result-card{
background:#1C2550;
border-radius:28px;
padding:32px;
margin-top:40px;
}

.emoji{
font-size:72px;
margin-bottom:16px;
}

.title{
font-size:32px;
font-weight:700;
margin-bottom:24px;
}

.distance{
font-size:56px;
font-weight:700;
margin-bottom:8px;
}

.unit{
opacity:.7;
margin-bottom:24px;
}

.stat{
background:#2A3467;
border-radius:16px;
padding:16px;
margin-bottom:12px;
}

.label{
font-size:12px;
opacity:.7;
margin-bottom:6px;
}

.value{
font-size:22px;
font-weight:700;
}

.xp{
font-size:28px;
font-weight:700;
color:#D4A63D;
margin-top:24px;
}

.btn{
display:block;
margin-top:20px;
background:#D4A63D;
color:#0B1023;
padding:16px;
border-radius:18px;
text-decoration:none;
font-weight:700;
}

.secondary{
background:#1C2550;
color:white;
border:1px solid #2D3E88;
}

</style>
</head>
<body>

<div class="result-card">

<div class="emoji">
🏃
</div>

<div class="title">
Run Complete
</div>

<div id="distance" class="distance">
0.00
</div>

<div class="unit">
KM
</div>

<div class="stat">
<div class="label">
TIME
</div>
<div id="time" class="value">
00:00
</div>
</div>

<div class="stat">
<div class="label">
PACE
</div>
<div id="pace" class="value">
0:00
</div>
</div>

<div class="xp">
+<span id="xp">0</span> XP
</div>

<a
id="achievementBtn"
class="btn"
href="#">
View Achievement
</a>

<a
href="Home.html"
class="btn secondary">
Back Home
</a>

</div>

<script>

const params =
new URLSearchParams(
window.location.search
);

const distance =
Number(
params.get("distance") || 0
);

const duration =
Number(
params.get("duration") || 0
);

const xp =
Math.round(
distance * 10
);

const paceSeconds =
distance > 0
? duration / distance
: 0;

const paceMin =
Math.floor(
paceSeconds / 60
);

const paceSec =
Math.floor(
paceSeconds % 60
);

document.getElementById("distance")
.innerText =
distance.toFixed(2);

document.getElementById("xp")
.innerText =
xp;

document.getElementById("pace")
.innerText =
`${paceMin}:${String(paceSec).padStart(2,'0')}`;

const mins =
Math.floor(duration/60);

const secs =
duration % 60;

document.getElementById("time")
.innerText =
`${mins}분 ${secs}초`;

document
.getElementById("achievementBtn")
.href =
`AchievementPopup.html?title=첫 5K&rarity=COMMON&xp=${xp}&icon=🏃`;

</script>

</body>
</html>
