<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Card</title>

<style>

body{
background:#0B1023;
color:white;
font-family:sans-serif;
max-width:430px;
margin:auto;
padding:20px;
}

.card{
background:#1C2550;
padding:20px;
border-radius:20px;
margin-top:20px;
}

.rarity{
margin-top:10px;
opacity:0.7;
}

.section{
margin-top:20px;
}

a{
color:#D4A63D;
}

</style>
</head>

<body>

<h1 id="card-name">
Loading...
</h1>

<div class="card">

<div id="card-rarity">
Loading...
</div>

<div class="section">

<b>Category</b>

<div id="card-category"></div>

</div>

</div>

<br>

<a href="Passport.html">
Back
</a>

<script>

const params =
new URLSearchParams(
window.location.search
);

const cardId =
params.get("id");

fetch('./data/cards.json')
.then(r=>r.json())
.then(cards=>{

const card =
cards.find(
c => c.id === cardId
);

if(!card) return;

document.getElementById('card-name')
.innerText = card.name;

document.getElementById('card-rarity')
.innerText = card.rarity;

document.getElementById('card-category')
.innerText = card.category;

});

</script>

</body>
</html>
