<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RunPassport Card</title>

<style>

body{
background:#0B1023;
color:white;
font-family:sans-serif;
max-width:430px;
margin:auto;
padding:20px;
}

.card{
background:#1C2550;
border-radius:20px;
padding:20px;
margin-top:20px;
}

.name{
font-size:32px;
font-weight:bold;
}

.rarity{
margin-top:10px;
opacity:0.7;
}

.section{
margin-top:25px;
}

.label{
color:#D4A63D;
margin-bottom:8px;
}

.value{
line-height:1.5;
}

a{
color:#D4A63D;
}

</style>

</head>

<body>

<div class="card">

<div id="card-name" class="name">
Loading...
</div>

<div id="card-rarity" class="rarity">
Loading...
</div>

<div class="section">
<div class="label">설명</div>
<div id="card-description" class="value"></div>
</div>

<div class="section">
<div class="label">획득 조건</div>
<div id="card-condition" class="value"></div>
</div>

<div class="section">
<div class="label">카테고리</div>
<div id="card-category" class="value"></div>
</div>

</div>

<br>

<a href="Passport.html">
← Passport
</a>

<script>

const params =
new URLSearchParams(window.location.search);

const cardId =
params.get("id");

fetch('./data/cards.json')
.then(r=>r.json())
.then(cards=>{

const card =
cards.find(c=>c.id===cardId);

if(!card) return;

document.getElementById('card-name')
.innerText = card.name;

document.getElementById('card-rarity')
.innerText = card.rarity;

document.getElementById('card-description')
.innerText = card.description;

document.getElementById('card-condition')
.innerText = card.condition;

document.getElementById('card-category')
.innerText = card.category;

});

</script>

</body>
</html>
