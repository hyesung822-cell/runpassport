<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Card</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:100px;
}

.card-hero{
background:linear-gradient(135deg,#1C2550,#2D3E88);
border-radius:28px;
padding:32px;
text-align:center;
margin-bottom:24px;
}

.icon{
font-size:72px;
margin-bottom:16px;
}

.card-name{
font-size:32px;
font-weight:700;
margin-bottom:12px;
}

.rarity{
display:inline-block;
padding:8px 16px;
border-radius:999px;
font-size:12px;
font-weight:700;
margin-bottom:20px;
}

.common{
background:#BFC5D2;
color:#0B1023;
}

.rare{
background:#5DA9FF;
color:white;
}

.epic{
background:#C07BFF;
color:white;
}

.legendary{
background:#D4A63D;
color:#0B1023;
}

.description{
line-height:1.6;
opacity:.9;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:12px;
}

.info-card{
background:#1C2550;
padding:18px;
border-radius:18px;
margin-bottom:12px;
}

.label{
font-size:12px;
opacity:.7;
margin-bottom:6px;
}

.value{
font-size:18px;
font-weight:700;
}

.back-btn{
display:block;
margin-top:20px;
text-align:center;
background:#D4A63D;
color:#0B1023;
padding:16px;
border-radius:18px;
text-decoration:none;
font-weight:700;
}

</style>
</head>

<body>

<div class="card-hero">

<div id="icon" class="icon">
🏅
</div>

<div id="card-name" class="card-name">
Loading...
</div>

<div id="rarity">
Loading...
</div>

<div id="description" class="description">
Loading...
</div>

</div>

<div class="section-title">
Card Info
</div>

<div class="info-card">

<div class="label">
CATEGORY
</div>

<div id="category" class="value">
Loading...
</div>

</div>

<div class="info-card">

<div class="label">
CARD ID
</div>

<div id="card-id" class="value">
Loading...
</div>

</div>

<a
href="Passport.html"
class="back-btn">
← Back to Passport
</a>

<script>

const params =
new URLSearchParams(
window.location.search
);

const cardId =
params.get('id');

fetch('./data/cards.json')

.then(r=>r.json())

.then(cards=>{

const card =
cards.find(
c => c.id === cardId
);

if(!card) return;

const icons = {
time:'⏰',
habit:'🔥',
distance:'🏃',
passport:'🌍',
growth:'📈'
};

document.getElementById('icon')
.innerText =
icons[card.category] || '🏅';

document.getElementById('card-name')
.innerText =
card.name;

document.getElementById('category')
.innerText =
card.category;

document.getElementById('card-id')
.innerText =
card.id;

document.getElementById('rarity')
.innerHTML =
`<span class="rarity ${card.rarity}">
${card.rarity.toUpperCase()}
</span>`;

const descriptions = {

time:
'특정 시간대 러닝을 통해 획득한 카드입니다.',

habit:
'꾸준함과 습관 형성을 통해 획득한 카드입니다.',

distance:
'누적 거리 달성을 통해 획득한 카드입니다.',

passport:
'새로운 지역과 도시를 탐험하여 획득한 카드입니다.',

growth:
'기록 향상과 성장으로 획득한 카드입니다.'

};

document.getElementById('description')
.innerText =
descriptions[card.category] ||
'RunPassport 카드';

});

</script>

</body>
</html>
