<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Identity Detail</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:100px;
}

.identity-card{
background:#1C2550;
border-radius:28px;
padding:28px;
text-align:center;
}

.icon{
font-size:72px;
margin-bottom:16px;
}

.name{
font-size:32px;
font-weight:700;
margin-bottom:10px;
}

.rarity{
font-size:14px;
font-weight:700;
margin-bottom:20px;
}

.common{
color:#C9CDD4;
}

.rare{
color:#4DA3FF;
}

.epic{
color:#B06CFF;
}

.legendary{
color:#F5C451;
}

.section{
margin-top:24px;
text-align:left;
}

.label{
font-size:13px;
font-weight:700;
color:#D4A63D;
margin-bottom:8px;
}

.value{
line-height:1.6;
}

.main-button{
width:100%;
margin-top:24px;
padding:16px;
border:none;
border-radius:16px;
background:#D4A63D;
color:#0B1023;
font-weight:700;
font-size:15px;
}

.back{
display:inline-block;
margin-top:20px;
color:#D4A63D;
text-decoration:none;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:430px;
margin:auto;
background:#141A33;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:1px solid #252D52;
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.active{
color:#D4A63D !important;
}

</style>

</head>

<body>

<div class="identity-card">

<div id="identity-icon" class="icon">
🌅
</div>

<div id="identity-name" class="name">
Loading...
</div>

<div id="identity-rarity" class="rarity">
Loading...
</div>

<div class="section">

<div class="label">
설명
</div>

<div id="identity-description" class="value">
Loading...
</div>

</div>

<div class="section">

<div class="label">
획득 조건
</div>

<div id="identity-condition" class="value">
Loading...
</div>

</div>

<button class="main-button">
대표 정체성
</button>

</div>

<a class="back" href="Identity.html">
← Identity로 돌아가기
</a>

<div class="bottom-nav">

<a href="Home.html">
Home
</a>

<a href="Passport.html">
Passport
</a>

<a class="active" href="Identity.html">
Identity
</a>

<a href="Profile.html">
Profile
</a>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const identityId =
params.get("id");

fetch('./data/identities.json')
.then(r=>r.json())
.then(identities=>{

const identity =
identities.find(
i => i.id === identityId
);

if(!identity) return;

document.getElementById('identity-icon')
.innerText =
identity.icon;

document.getElementById('identity-name')
.innerText =
identity.name;

const rarity =
document.getElementById('identity-rarity');

rarity.innerText =
identity.rarity.toUpperCase();

rarity.classList.add(identity.rarity);

document.getElementById('identity-description')
.innerText =
identity.description;

document.getElementById('identity-condition')
.innerText =
identity.condition;

});

</script>

</body>
</html>
