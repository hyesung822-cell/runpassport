<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Identity Detail</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:40px;
}

.hero{
background:linear-gradient(135deg,#1C2550,#2D3E88);
border-radius:28px;
padding:32px;
text-align:center;
margin-bottom:24px;
}

.icon{
font-size:72px;
margin-bottom:16px;
}

.name{
font-size:32px;
font-weight:700;
margin-bottom:12px;
}

.rarity{
display:inline-block;
padding:8px 16px;
border-radius:999px;
font-size:12px;
font-weight:700;
margin-bottom:20px;
}

.rare{
background:#5DA9FF;
color:white;
}

.epic{
background:#C07BFF;
color:white;
}

.legendary{
background:#D4A63D;
color:#0B1023;
}

.description{
line-height:1.6;
opacity:.9;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:12px;
}

.info-card{
background:#1C2550;
padding:18px;
border-radius:18px;
margin-bottom:12px;
}

.label{
font-size:12px;
opacity:.7;
margin-bottom:6px;
}

.value{
font-size:18px;
font-weight:700;
}

.main-btn{
display:block;
margin-top:20px;
text-align:center;
background:#D4A63D;
color:#0B1023;
padding:16px;
border-radius:18px;
text-decoration:none;
font-weight:700;
}

.back-btn{
display:block;
margin-top:12px;
text-align:center;
background:#1C2550;
color:white;
padding:16px;
border-radius:18px;
text-decoration:none;
}

</style>
</head>

<body>

<div class="hero">

<div id="icon" class="icon">
🌅
</div>

<div id="name" class="name">
Loading...
</div>

<div id="rarity-container">
Loading...
</div>

<div id="description" class="description">
Loading...
</div>

</div>

<div class="section-title">
Identity Info
</div>

<div class="info-card">

<div class="label">
RARITY
</div>

<div id="rarity-text" class="value">
Loading...
</div>

</div>

<div class="info-card">

<div class="label">
UNLOCK CONDITION
</div>

<div id="condition" class="value">
Loading...
</div>

</div>

<a
href="#"
class="main-btn">
⭐ Set as Main Identity
</a>

<a
href="Identity.html"
class="back-btn">
← Back to Collection
</a>

<script>

const params =
new URLSearchParams(
window.location.search
);

const identityId =
params.get('id');

fetch('./data/identities.json')

.then(r=>r.json())

.then(identities=>{

const identity =
identities.find(
i => i.id === identityId
);

if(!identity) return;

document.getElementById('icon')
.innerText =
identity.icon || '🏅';

document.getElementById('name')
.innerText =
identity.name;

document.getElementById('description')
.innerText =
identity.description ||
'RunPassport Identity';

document.getElementById('rarity-text')
.innerText =
identity.rarity.toUpperCase();

document.getElementById('condition')
.innerText =
identity.condition ||
'조건 정보 없음';

document.getElementById('rarity-container')
.innerHTML =
`<span class="rarity ${identity.rarity}">
${identity.rarity.toUpperCase()}
</span>`;

});

</script>

</body>
</html>
