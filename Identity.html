<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Identity</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:40px;
}

h1{
font-size:36px;
margin-bottom:24px;
}

.summary{
background:#1C2550;
padding:20px;
border-radius:20px;
margin-bottom:24px;
}

.summary-value{
font-size:42px;
font-weight:700;
}

.summary-label{
opacity:.7;
margin-top:4px;
}

.identity-link{
text-decoration:none;
color:white;
}

.identity-card{
background:#1C2550;
border-radius:18px;
padding:18px;
margin-bottom:12px;
}

.icon{
font-size:36px;
margin-bottom:8px;
}

.name{
font-size:20px;
font-weight:700;
margin-bottom:8px;
}

.rarity{
font-size:12px;
font-weight:700;
}

.rare{
color:#5DA9FF;
}

.epic{
color:#C07BFF;
}

.legendary{
color:#D4A63D;
}

.back-btn{
display:block;
margin-top:20px;
text-align:center;
background:#D4A63D;
color:#0B1023;
padding:16px;
border-radius:18px;
text-decoration:none;
font-weight:700;
}

</style>
</head>

<body>

<h1>Identity Collection</h1>

<div class="summary">

<div
id="identity-count"
class="summary-value">
0
</div>

<div class="summary-label">
Unlocked Identities
</div>

</div>

<div id="identity-list">
Loading...
</div>

<a
href="Profile.html"
class="back-btn">
← Back to Profile
</a>

<script>

Promise.all([
fetch('./data/identities.json')
.then(r=>r.json()),

fetch('./data/user.json')
.then(r=>r.json())
])

.then(([identities,user])=>{

const unlocked =
user.unlockedIdentities;

const list =
identities.filter(identity =>
unlocked.includes(identity.id)
);

document.getElementById('identity-count')
.innerText =
list.length;

const container =
document.getElementById('identity-list');

container.innerHTML = '';

list.forEach(identity=>{

container.innerHTML += `

<a
class="identity-link"
href="IdentityDetail.html?id=${identity.id}"
>

<div class="identity-card">

<div class="icon">
${identity.icon || '🏅'}
</div>

<div class="name">
${identity.name}
</div>

<div
class="rarity ${identity.rarity}">
${identity.rarity.toUpperCase()}
</div>

</div>

</a>

`;

});

});

</script>

</body>
</html>
