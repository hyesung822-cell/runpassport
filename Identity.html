<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport - Identity</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:100px;
}

h1{
margin-bottom:24px;
font-size:32px;
}

.identity-link{
text-decoration:none;
color:white;
}

.identity{
background:#1C2550;
border-radius:24px;
padding:24px;
margin-bottom:16px;
text-align:center;
}

.icon{
font-size:56px;
margin-bottom:12px;
}

.name{
font-size:24px;
font-weight:700;
margin-bottom:10px;
}

.rarity{
font-size:13px;
font-weight:700;
letter-spacing:1px;
margin-bottom:12px;
}

.common{
color:#C9CDD4;
}

.rare{
color:#4DA3FF;
}

.epic{
color:#B06CFF;
}

.legendary{
color:#F5C451;
}

.description{
line-height:1.6;
opacity:0.9;
margin-bottom:16px;
}

.condition{
font-size:13px;
color:#D4A63D;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:430px;
margin:auto;
background:#141A33;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:1px solid #252D52;
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.active{
color:#D4A63D !important;
}

</style>

</head>

<body>

<h1>Identity</h1>

<div id="identity-list">
Loading...
</div>

<div class="bottom-nav">

<a href="Home.html">
Home
</a>

<a href="Passport.html">
Passport
</a>

<a class="active" href="Identity.html">
Identity
</a>

<a href="Profile.html">
Profile
</a>

</div>

<script>

Promise.all([
fetch('./data/identities.json').then(r=>r.json()),
fetch('./data/user.json').then(r=>r.json())
])

.then(([identities,user])=>{

const unlockedIdentities =
identities.filter(identity =>
user.unlockedIdentities.includes(identity.id)
);

const container =
document.getElementById('identity-list');

container.innerHTML = '';

unlockedIdentities.forEach(identity => {

container.innerHTML += `

<a class="identity-link"
href="IdentityDetail.html?id=${identity.id}">

<div class="identity">

<div class="icon">
${identity.icon}
</div>

<div class="name">
${identity.name}
</div>

<div class="rarity ${identity.rarity}">
${identity.rarity.toUpperCase()}
</div>

<div class="description">
${identity.description}
</div>

<div class="condition">
${identity.condition}
</div>

</div>

</a>

`;

});

})

.catch(error=>{

console.error(error);

document.getElementById('identity-list')
.innerHTML =
'데이터 로딩 실패';

});

</script>

</body>
</html>
