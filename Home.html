<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RunPassport</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#0B1023;
    color:white;
    font-family:sans-serif;
    max-width:430px;
    margin:auto;
}

.header{
    margin-top:20px;
}

.greeting{
    color:#B8C0FF;
    font-size:14px;
}

.name{
    font-size:42px;
    font-weight:bold;
    margin-top:10px;
}

.badges{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.badge{
    border:1px solid #4D5FFF;
    border-radius:20px;
    padding:8px 14px;
    font-size:14px;
}

.identity-card{
    margin-top:30px;
    background:#1C2550;
    border-radius:24px;
    padding:20px;
}

.identity-title{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
}

.identity-sub{
    color:#C6CCFF;
    margin-top:10px;
}

.progress{
    margin-top:20px;
}

.progress-bar{
    height:10px;
    background:#303A73;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:84%;
    height:100%;
    background:#D4A63D;
}

.section-title{
    margin-top:40px;
    margin-bottom:15px;
    font-size:28px;
    font-weight:bold;
}

.stats-card{
    background:#1C2550;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
}

.stats-value{
    font-size:24px;
    font-weight:bold;
}

.nav{
    margin-top:40px;
    display:flex;
    justify-content:space-between;
}

.nav a{
    color:#D4A63D;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="header">

<div class="greeting">
Good morning
</div>

<div class="name" id="identity-name">
Loading...
</div>

<div class="badges">

<div class="badge" id="level">
LEVEL
</div>

<div class="badge" id="stats">
RUNS
</div>

</div>

</div>

<div class="identity-card">

<div>
MAIN IDENTITY
</div>

<div class="identity-title" id="main-identity">
Loading...
</div>

<div class="identity-sub">
Distance doesn't intimidate you — it defines you.
</div>

<div class="progress">

<div style="display:flex;justify-content:space-between;margin-bottom:10px;">
<div>Next card</div>
<div id="distance-progress">0 km</div>
</div>

<div class="progress-bar">
<div class="progress-fill"></div>
</div>

</div>

</div>

<div class="section-title">
Collection
</div>

<div class="stats-card">

<div class="stats-value" id="card-count">
0
</div>

Cards

</div>

<div class="stats-card">

<div class="stats-value" id="identity-count">
0
</div>

Identities

</div>

<div class="nav">

<a href="Passport.html">
Passport
</a>

<a href="Identity.html">
Identity
</a>

</div>

<script>

Promise.all([
fetch('./data/user.json').then(r=>r.json()),
fetch('./data/cards.json').then(r=>r.json()),
fetch('./data/identities.json').then(r=>r.json())
])

.then(([user,cards,identities])=>{

document.getElementById('level').innerText =
'LEVEL ' + user.level;

document.getElementById('stats').innerText =
user.runs + ' runs · ' +
user.distance + ' km';

document.getElementById('distance-progress').innerText =
user.distance + ' km';

document.getElementById('card-count').innerText =
user.earnedCards.length;

document.getElementById('identity-count').innerText =
user.unlockedIdentities.length;

const identity =
identities.find(
i => i.id === user.mainIdentity
);

if(identity){

document.getElementById('identity-name').innerText =
identity.name;

document.getElementById('main-identity').innerText =
identity.name;

}

})

.catch(error=>{

console.error(error);

});

</script>

</body>
</html>
