<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0B1023;
color:white;
max-width:430px;
margin:auto;
padding:24px;
padding-bottom:100px;
}

.greeting{
font-size:14px;
color:#B8C0FF;
margin-bottom:8px;
}

.user-name{
font-size:42px;
font-weight:700;
margin-bottom:20px;
}

.badges{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:24px;
}

.badge{
padding:8px 14px;
border:1px solid #4D5FFF;
border-radius:999px;
font-size:14px;
}

.identity-card{
background:linear-gradient(135deg,#1C2550,#2D3E88);
border-radius:24px;
padding:24px;
margin-bottom:24px;
}

.identity-label{
font-size:12px;
opacity:0.8;
margin-bottom:10px;
}

.identity-icon{
font-size:52px;
margin-bottom:10px;
}

.identity-name{
font-size:30px;
font-weight:700;
margin-bottom:8px;
}

.identity-desc{
opacity:0.9;
line-height:1.5;
}

.section-title{
font-size:24px;
font-weight:700;
margin-bottom:14px;
margin-top:24px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.stat-card{
background:#1C2550;
border-radius:20px;
padding:20px;
}

.stat-value{
font-size:30px;
font-weight:700;
}

.stat-label{
opacity:0.7;
margin-top:4px;
}

.recent-card{
background:#1C2550;
padding:14px;
border-radius:16px;
margin-bottom:10px;
}

.goal-card{
background:#1C2550;
padding:20px;
border-radius:20px;
}

.progress{
background:#313A6C;
height:10px;
border-radius:999px;
margin-top:12px;
overflow:hidden;
}

.progress-fill{
background:#D4A63D;
height:100%;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
max-width:430px;
margin:auto;
background:#141A33;
display:flex;
justify-content:space-around;
padding:18px 0;
border-top:1px solid #252D52;
}

.bottom-nav a{
color:white;
text-decoration:none;
font-size:14px;
}

.active{
color:#D4A63D !important;
}

</style>

</head>

<body>

<div class="greeting">
Good morning
</div>

<div id="user-name" class="user-name">
Loading...
</div>

<div class="badges">

<div id="level" class="badge">
LEVEL
</div>

<div id="stats-badge" class="badge">
Stats
</div>

</div>

<div class="identity-card">

<div class="identity-label">
MAIN IDENTITY
</div>

<div id="identity-icon" class="identity-icon">
🌅
</div>

<div id="identity-name" class="identity-name">
Loading...
</div>

<div id="identity-description" class="identity-desc">
Loading...
</div>

</div>

<div class="section-title">
Stats
</div>

<div class="stats">

<div class="stat-card">
<div id="distance" class="stat-value">0</div>
<div class="stat-label">KM</div>
</div>

<div class="stat-card">
<div id="runs" class="stat-value">0</div>
<div class="stat-label">Runs</div>
</div>

<div class="stat-card">
<div id="cards" class="stat-value">0</div>
<div class="stat-label">Cards</div>
</div>

<div class="stat-card">
<div id="identities" class="stat-value">0</div>
<div class="stat-label">Identities</div>
</div>

</div>

<div class="section-title">
Recent Cards
</div>

<div id="recent-cards">
Loading...
</div>

<div class="section-title">
Next Goal
</div>

<div class="goal-card">

<div id="goal-name">
Loading...
</div>

<div id="goal-progress">
Loading...
</div>

<div class="progress">
<div id="progress-fill" class="progress-fill"></div>
</div>

</div>

<div class="bottom-nav">

<a class="active" href="Home.html">
Home
</a>

<a href="Run.html">
Run
</a>

<a href="Calendar.html">
Calendar
</a>

<a href="Passport.html">
Passport
</a>

<a href="Profile.html">
Profile
</a>

</div>

<script>

Promise.all([
fetch('./data/user.json').then(r=>r.json()),
fetch('./data/identities.json').then(r=>r.json()),
fetch('./data/cards.json').then(r=>r.json())
])

.then(([user,identities,cards])=>{

document.getElementById('user-name').innerText =
user.name;

document.getElementById('level').innerText =
'LEVEL ' + user.level;

document.getElementById('stats-badge').innerText =
user.runs + ' runs · ' + user.distance + ' km';

document.getElementById('distance').innerText =
user.distance;

document.getElementById('runs').innerText =
user.runs;

document.getElementById('cards').innerText =
user.earnedCards.length;

document.getElementById('identities').innerText =
user.unlockedIdentities.length;

const identity =
identities.find(
i => i.id === user.mainIdentity
);

if(identity){

document.getElementById('identity-name').innerText =
identity.name;

document.getElementById('identity-description').innerText =
identity.description;

document.getElementById('identity-icon').innerText =
identity.icon;

}

const recent =
user.earnedCards.slice(-3);

const recentContainer =
document.getElementById('recent-cards');

recentContainer.innerHTML='';

const icons={
time:'⏰',
habit:'🔥',
distance:'🏃',
passport:'🌍',
growth:'📈'
};

recent.forEach(cardId=>{

const card=
cards.find(c=>c.id===cardId);

if(card){

recentContainer.innerHTML += `
<div class="recent-card">
${icons[card.category] || '🏅'}
 ${card.name}
</div>
`;

}

});

document.getElementById('goal-name').innerText =
user.nextGoal.name;

document.getElementById('goal-progress').innerText =
`${user.nextGoal.current} / ${user.nextGoal.target}`;

const percent =
(user.nextGoal.current /
user.nextGoal.target) * 100;

document.getElementById('progress-fill')
.style.width =
percent + '%';

});

</script>

</body>
</html>
