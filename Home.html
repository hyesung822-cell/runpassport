<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RunPassport</title>
</head>

<body>

<h1>RunPassport</h1>

<h2>Running Data → Identity</h2>

<hr>

<p id="card-count">카드 수 계산중...</p>
<p id="identity-count">정체성 수 계산중...</p>

<hr>

<a href="Passport.html">Passport</a>
<br><br>
<a href="Identity.html">Identity</a>

<script>

fetch('./data/cards.json')
  .then(response => response.json())
  .then(cards => {

    document.getElementById('card-count').textContent =
      '총 카드 수: ' + cards.length;

  });

fetch('./data/identities.json')
  .then(response => response.json())
  .then(identities => {

    document.getElementById('identity-count').textContent =
      '총 정체성 수: ' + identities.length;

  });

</script>

</body>
</html>
